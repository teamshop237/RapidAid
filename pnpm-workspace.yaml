packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: true

# Exact Expo SDK 57 packages required by the prototype. These targeted
# exceptions keep the host release-age policy enabled for every other package.
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.27'
  - '@expo/router-server@57.0.11'
  - '@expo/ui@57.0.20'
  - babel-preset-expo@57.0.13
  - expo-glass-effect@57.0.4
  - expo-linking@57.0.11
  - expo-modules-core@57.0.19
  - expo-modules-jsi@57.1.1
  - expo-router@57.0.23
  - expo@57.0.25
